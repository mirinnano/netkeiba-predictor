[package]
name = "netkeiba-predictor"
version = "0.1.0"
description = "netkeiba scraping horse racing prediction & ROI simulation app"
authors = ["KeibaScope"]
edition = "2021"

[lib]
name = "netkeiba_predictor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "charset", "http2", "macos-system-configuration"] }
scraper = "0.20"
encoding_rs = "0.8"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }

# HTTPS: デスクトップは OS の TLS、Android は rustls（OpenSSL を持ち込まないため）
[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
